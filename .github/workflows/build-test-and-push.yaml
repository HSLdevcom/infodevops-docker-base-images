name: Build, Test & Push Base Images

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: CI – Lint, Build & Test Base Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        image:
          - java-11
          - java-17
          - java-25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "./${{ matrix.image }}/Dockerfile"

      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          push: false
          tags: base-image-test:${{ matrix.image }}

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}/test
          push: false
          tags: base-image-test:${{ matrix.image }}-test

      - name: Test test image (hello world)
        run: |
          docker run --rm base-image-test:${{ matrix.image }}-test echo "Test OK"

  cd:
    name: CD - Build & Publish Base Images
    runs-on: ubuntu-latest
    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        image:
          - java-11
          - java-17
          - java-25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: hsldevcom/infodevops/base-images/${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.vendor=hsldevcom

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
